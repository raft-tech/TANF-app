worker_processes 1;
daemon off;

error_log stderr;
events { worker_connections 1024; }


http {
    charset utf-8;
    log_format cloudfoundry 'NginxLog "$request" $status $body_bytes_sent';
    access_log /dev/stdout cloudfoundry;

    default_type application/octet-stream;
    include mime.types;
    sendfile on;

    tcp_nopush on;
    keepalive_timeout 30;
    port_in_redirect off; # Ensure that redirects don't include the internal container PORT - 8080

    log_format compression '$remote_addr - $remote_user [$time_local] '
                            '"proxy_host and upstream_addr": $proxy_host $upstream_addr, '
                           ' "request": $request, '
                           '"body_bytes_sent" : $body_bytes_sent, '
                           '"request_body": $request_body, '
                           '"http_x_forwarded_for": $http_x_forwarded_for, '
                            '"host": $host, '
                            ' "status": $status, '
                            '"proxy_add_x_forwarded_for": $proxy_add_x_forwarded_for, '
                           '"http_referer": $http_referer, '
                           '"http_user_agent": $http_user_agent, '
                           '"cookies=$http_cookie;"  "server=$server_name" "http_host=$http_host"';

    limit_req_zone $binary_remote_addr zone=limitreqsbyaddr:20m rate=1000r/s;
    limit_req_status 444;

    resolver {{nameservers}} valid=5s;

    server {
        listen {{port}};

        access_log /home/vcap/app/nginx_access.log compression;

        # Keycloak proxy configuration
        location / {
            set $keycloak http://keycloak-dev.apps.internal:8080;
            proxy_pass $keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port {{port}};

            # Override X-Frame-Options to allow Keycloak to be displayed in iframes
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN";

            # WebSocket support (for admin console)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout settings
            proxy_connect_timeout 300;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            send_timeout 300;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # Default error pages
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
