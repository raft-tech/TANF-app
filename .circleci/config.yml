version: 2.1

# To help debugging circleci config changes you may want
# to run the generate_config.sh script locally and
# then copy the contents from generated_config.yml into the config.yml file.

# this allows you to use CircleCI's dynamic configuration feature
setup: true

# the continuation orb is required in order to use dynamic configuration
orbs:
  continuation: circleci/continuation@0.1.2

# parameters from github actions
parameters:
  build_and_test_all:
    type: boolean
    default: false
  build_and_test_backend:
    type: boolean
    default: false
  build_and_test_frontend:
    type: boolean
    default: false
  build_and_test_parser:
    type: boolean
    default: false
  deploy_infrastructure:
    type: boolean
    default: false
  develop_branch_deploy:
    type: boolean
    default: false
  run_dev_deployment:
    type: boolean
    default: false
  run_keycloak_deployment:
    type: boolean
    default: false
  keycloak_image:
    type: string
    default: ''
  keycloak_source_revision:
    type: string
    default: ''
  keycloak_only:
    type: boolean
    default: false
  run_nightly_owasp_scan:
    type: boolean
    default: false
  run_owasp_scan:
    type: boolean
    default: false
  target_env:
    type: string
    default: ''
  triggered:
    type: boolean
    default: false
  util_make_erd:
    type: boolean
    default: false
  registry_owner:
    type: string
    default: 'hhs'

jobs:
  setup:
    executor: continuation/default
    environment:
      KEYCLOAK_SOURCE_REVISION: << pipeline.parameters.keycloak_source_revision >>
    steps:
      - checkout # checkout code
      - run:
          name: Pin Keycloak pipeline revision
          command: |
            if [ -n "$KEYCLOAK_SOURCE_REVISION" ]; then
              if ! echo "$KEYCLOAK_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid Keycloak source revision: $KEYCLOAK_SOURCE_REVISION" >&2
                exit 1
              fi
              if ! git cat-file -e "${KEYCLOAK_SOURCE_REVISION}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$KEYCLOAK_SOURCE_REVISION"
              fi
              git checkout --detach "$KEYCLOAK_SOURCE_REVISION"
            fi
      - run: # run a command
          name: Generate config
          command: |
            cd .circleci
            chmod +x generate_config.sh
            ./generate_config.sh
      - continuation/continue:
          configuration_path: .circleci/generated_config.yml # use newly generated config to continue

# our single workflow, that triggers the setup job defined above
workflows:
  github-triggered-setup:
    when: << pipeline.parameters.triggered >>
    jobs:
      - setup
  circle-ci-setup:
    when:
      not: << pipeline.parameters.triggered >>
    jobs:
      - setup:
          filters:
            branches:
              only:
                - develop
                - main
                - master
                - /^release.*/
