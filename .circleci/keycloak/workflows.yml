# workflows:
  keycloak-deployment:
    when: << pipeline.parameters.run_keycloak_deployment >>
    jobs:
      - deploy-keycloak:
          name: deploy-keycloak-dev
          environment: dev
          app-name: keycloak-dev
          rds-service: tdp-keycloak-db-dev
          public-hostname: dev.auth
          cf-password: CF_PASSWORD_DEV
          cf-space: tanf-dev
          cf-username: CF_USERNAME_DEV
          expected-project-owner: raft-tech
          image: << pipeline.parameters.keycloak_image >>
          source-revision: << pipeline.parameters.keycloak_source_revision >>
          serial-group: keycloak-dev
          filters:
            branches:
              ignore:
                - develop
                - main
                - master
                - /^release.*/
      - deploy-keycloak:
          name: deploy-keycloak-staging-from-develop
          environment: staging
          app-name: keycloak-staging
          rds-service: tdp-keycloak-db-staging
          public-hostname: staging.auth
          cf-password: CF_PASSWORD_STAGING
          cf-space: tanf-staging
          cf-username: CF_USERNAME_STAGING
          expected-project-owner: raft-tech
          image: << pipeline.parameters.keycloak_image >>
          source-revision: << pipeline.parameters.keycloak_source_revision >>
          serial-group: keycloak-staging
          filters:
            branches:
              only:
                - develop
      - deploy-keycloak:
          name: deploy-keycloak-staging-from-main
          environment: staging
          app-name: keycloak-staging
          rds-service: tdp-keycloak-db-staging
          public-hostname: staging.auth
          cf-password: CF_PASSWORD_STAGING
          cf-space: tanf-staging
          cf-username: CF_USERNAME_STAGING
          expected-project-owner: hhs
          image: << pipeline.parameters.keycloak_image >>
          source-revision: << pipeline.parameters.keycloak_source_revision >>
          serial-group: keycloak-staging
          filters:
            branches:
              only:
                - main
      - deploy-keycloak:
          name: deploy-keycloak-production
          environment: prod
          app-name: keycloak
          rds-service: tdp-keycloak-db-prod
          public-hostname: auth
          cf-password: CF_PASSWORD_PROD
          cf-space: tanf-prod
          cf-username: CF_USERNAME_PROD
          expected-project-owner: hhs
          image: << pipeline.parameters.keycloak_image >>
          source-revision: << pipeline.parameters.keycloak_source_revision >>
          serial-group: keycloak-production
          filters:
            branches:
              only:
                - master
