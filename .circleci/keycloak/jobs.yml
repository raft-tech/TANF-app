# jobs:
  deploy-keycloak:
    parameters:
      environment:
        type: enum
        enum: [dev, staging, prod]
      app-name:
        type: string
      rds-service:
        type: string
      public-hostname:
        type: string
      cf-password:
        type: env_var_name
      cf-space:
        type: string
      cf-username:
        type: env_var_name
      expected-project-owner:
        type: enum
        enum: [raft-tech, hhs]
      image:
        type: string
      source-revision:
        type: string
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - checkout
      - checkout-keycloak-source:
          revision: <<parameters.source-revision>>
      - verify-keycloak-project-owner:
          expected-owner: <<parameters.expected-project-owner>>
      - sudo-check
      - cf-check
      - login-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - deploy-keycloak-image:
          environment: <<parameters.environment>>
          rds-service: <<parameters.rds-service>>
          public-hostname: <<parameters.public-hostname>>
          image: <<parameters.image>>
          expected-owner: <<parameters.expected-project-owner>>
      - verify-keycloak-deployment:
          app-name: <<parameters.app-name>>
          public-hostname: <<parameters.public-hostname>>
          image: <<parameters.image>>
