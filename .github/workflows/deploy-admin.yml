name: Deploy admin with CircleCI

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  trigger-admin-deployment:
    if: >-
      github.event.label.name == 'Deploy admin-raft' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CircleCI admin deployment
        uses: promiseofcake/circleci-trigger-action@v1
        with:
          user-token: ${{ secrets.CIRCLE_CI_V2_TOKEN }}
          project-slug: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          payload: |
            {
              "run_admin_deployment": true,
              "admin_target_env": "test",
              "admin_revision": "${{ github.event.pull_request.head.sha }}",
              "triggered": true
            }
