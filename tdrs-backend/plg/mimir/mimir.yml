multitenancy_enabled: false


server:
  http_listen_port: 8080 # use 9009 for local
  log_level: info

common:
  storage:
    backend: s3
    s3:
      bucket_name: "${S3_BUCKET}"
      endpoint: "${S3_ENDPOINT}"
      secret_access_key: "${S3_SECRET_KEY}"
      access_key_id: "${S3_ACCESS_KEY}"
      region: "${S3_REGION}"
    
compactor:
  data_dir: /tmp/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/rules

store_gateway:
  sharding_ring:
    replication_factor: 1

